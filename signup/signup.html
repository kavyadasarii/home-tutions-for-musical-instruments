<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — Raga House</title>
<meta name="description" content="Create a Raga House account to book weekly music lessons at home.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,460;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../home/style.css">
<link rel="stylesheet" href="auth.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 110'%3E%3Cpath d='M10 82c20 10 38 4 50-6' stroke='%23B98A3A' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3Cpath d='M24 62c7-11 4-22-6-30' stroke='%23B98A3A' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3Cpath d='M15 46c7-2 12-9 9-16-7 2-12 9-9 16z' fill='%23B98A3A'/%3E%3Cpath d='M24 60c7-1 12-7 11-14-7 1-12 7-11 14z' fill='%23B98A3A'/%3E%3Cpath d='M22 54 L52 20 L52 20' stroke='%23172A46' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M52 20 L88 54' stroke='%23172A46' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M88 10 V70' stroke='%23172A46' stroke-width='7' stroke-linecap='round'/%3E%3Cpath d='M88 10c16 7 22 19 15 32-4-11-11-18-15-20z' fill='%23172A46'/%3E%3Cellipse cx='80' cy='76' rx='13' ry='10' fill='%23172A46' transform='rotate(-20 80 76)'/%3E%3Crect x='38' y='44' width='8' height='8' fill='%23172A46'/%3E%3Crect x='50' y='44' width='8' height='8' fill='%23172A46'/%3E%3C/svg%3E">
</head>
<body class="auth-body">

<div class="auth-topbar">
  <button class="btn btn-outline btn-sm" id="dir-toggle" aria-label="Toggle text direction">RTL</button>
  <button class="icon-btn" id="theme-toggle" aria-label="Toggle dark mode">
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="4.2"/><path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3M18.4 5.6l-1.5 1.5M7.1 16.9l-1.5 1.5M18.4 18.4l-1.5-1.5M7.1 7.1L5.6 5.6" stroke-linecap="round"/></svg>
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z" stroke-linejoin="round"/></svg>
  </button>
</div>

<div class="auth-shell">
  <div class="auth-card">

    <a href="../home/index.html" class="brand auth-card-logo" aria-label="Raga House — back to home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 120 110" fill="none">
          <path d="M10 82c20 10 38 4 50-6" stroke="var(--logo-gold)" stroke-width="6" fill="none" stroke-linecap="round"/>
          <path d="M24 62c7-11 4-22-6-30" stroke="var(--logo-gold)" stroke-width="6" fill="none" stroke-linecap="round"/>
          <path d="M15 46c7-2 12-9 9-16-7 2-12 9-9 16z" fill="var(--logo-gold)"/>
          <path d="M24 60c7-1 12-7 11-14-7 1-12 7-11 14z" fill="var(--logo-gold)"/>
          <path d="M22 54 L52 20 L88 54" stroke="var(--logo-ink)" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M88 10 V70" stroke="var(--logo-ink)" stroke-width="7" stroke-linecap="round"/>
          <path d="M88 10c16 7 22 19 15 32-4-11-11-18-15-20z" fill="var(--logo-ink)"/>
          <ellipse cx="80" cy="76" rx="13" ry="10" fill="var(--logo-ink)" transform="rotate(-20 80 76)"/>
          <rect x="38" y="44" width="8" height="8" fill="var(--logo-ink)"/>
          <rect x="50" y="44" width="8" height="8" fill="var(--logo-ink)"/>
        </svg>
      </span>
      <span class="logo-text">
        <span class="logo-word">Raga<em>House</em></span>
        <span class="brand-sub">Home Music Tuitions</span>
      </span>
    </a>

    <div class="auth-head">
      <h1>Create your account</h1>
      <p>Set up your family's profile to book your first home lesson.</p>
    </div>

    <form class="auth-form" id="signup-form" novalidate>
      <div class="form-row form-pair cols-3">
        <div>
          <label for="signup-first">First name</label>
          <input id="signup-first" type="text" placeholder="First name" autocomplete="given-name" required>
        </div>
        <div>
          <label for="signup-last">Last name</label>
          <input id="signup-last" type="text" placeholder="Last name" autocomplete="family-name" required>
        </div>
        <div>
          <label for="signup-email">Email address</label>
          <input id="signup-email" type="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
      </div>

      <div class="form-row form-pair cols-2">
        <div>
          <label for="signup-phone">Phone number</label>
          <input id="signup-phone" type="tel" placeholder="10-digit number" autocomplete="tel" required>
        </div>
        <div>
          <label for="signup-instrument">Instrument</label>
          <select id="signup-instrument">
            <option>Guitar</option>
            <option>Piano</option>
            <option>Violin</option>
            <option>Tabla</option>
          </select>
        </div>
      </div>

      <div class="form-row form-pair cols-2">
        <div class="pw-field">
          <label for="signup-password">Password</label>
          <input id="signup-password" type="password" placeholder="Create a strong password" autocomplete="new-password" minlength="8" required>
          <button type="button" class="pw-toggle" data-for="signup-password" aria-label="Show password">
            <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12z" stroke-linejoin="round"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 3l18 18" stroke-linecap="round"/><path d="M10.6 5.1A10.9 10.9 0 0112 5c7 0 10.5 7 10.5 7a13.5 13.5 0 01-3.2 4.1M6.6 6.6C3.4 8.6 1.5 12 1.5 12s3.5 7 10.5 7c1.4 0 2.7-.3 3.9-.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 10a3 3 0 004.1 4.1" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="pw-field">
          <label for="signup-confirm">Confirm password</label>
          <input id="signup-confirm" type="password" placeholder="Re-enter your password" autocomplete="new-password" minlength="8" required>
          <button type="button" class="pw-toggle" data-for="signup-confirm" aria-label="Show password">
            <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12z" stroke-linejoin="round"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 3l18 18" stroke-linecap="round"/><path d="M10.6 5.1A10.9 10.9 0 0112 5c7 0 10.5 7 10.5 7a13.5 13.5 0 01-3.2 4.1M6.6 6.6C3.4 8.6 1.5 12 1.5 12s3.5 7 10.5 7c1.4 0 2.7-.3 3.9-.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 10a3 3 0 004.1 4.1" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>

      <div class="terms-row">
        <input type="checkbox" id="signup-terms" required>
        <label for="signup-terms">I agree to Raga House's <a href="../legal/terms.html">Terms of Service</a> and <a href="../legal/privacy.html">Privacy Policy</a>.</label>
      </div>

      <button type="submit" class="btn btn-primary">Create account <span class="arrow">→</span></button>
    </form>

    <div class="auth-divider"><span>or sign up with</span></div>

    <div class="social-btns">
      <button type="button" class="social-btn" data-provider="Google">
        <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.1 29.6 4 24 4c-7.6 0-14.2 4.3-17.7 10.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.2-5.1l-6.6-5.4C29.6 35.4 26.9 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.6 5.1C9.7 39.6 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.5l6.6 5.4C41.4 35.9 44 30.4 44 24c0-1.2-.1-2.4-.4-3.5z"/></svg>
        Google
      </button>
      <button type="button" class="social-btn" data-provider="Apple">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.4 1.6c.1 1.1-.3 2.2-1 3-.7.8-1.9 1.5-3 1.4-.1-1.1.4-2.2 1-3 .8-.9 2-1.5 3-1.4zM19.9 17.4c-.5 1.1-.7 1.6-1.3 2.6-.9 1.4-2.2 3.1-3.7 3.1-1.4 0-1.7-.9-3.5-.9-1.8 0-2.2.9-3.6.9-1.5 0-2.6-1.6-3.6-3-2.4-3.5-2.7-7.5-1.2-9.7 1.1-1.6 2.8-2.5 4.4-2.5 1.7 0 2.7 1 4.1 1 1.3 0 2.1-1 4.1-1 1.4 0 2.9.8 4 2.1-3.5 1.9-2.9 6.9.3 7.4z"/></svg>
        Apple
      </button>
      <button type="button" class="social-btn" data-provider="Facebook">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#1877F2"/><path fill="#fff" d="M15.1 12.9h-2v7h-2.9v-7H8.6v-2.5h1.6V8.7c0-1.6.8-3 3.2-3h2v2.5h-1.4c-.4 0-.7.3-.7.9v1.3h2.1l-.3 2.5z"/></svg>
        Facebook
      </button>
    </div>

    <p class="auth-foot">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="../home/script.js"></script>
<script src="auth.js"></script>
</body>
</html>
